services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skyforge
      POSTGRES_USER: skyforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skyforge-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyforge -d skyforge"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://skyforge:${POSTGRES_PASSWORD:-skyforge-local-password}@postgres:5432/skyforge
      ALLOW_INLINE_JOBS: "false"
    command: ["sh", "-c", "npx prisma migrate deploy && node scripts/encrypt-secrets.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://skyforge:${POSTGRES_PASSWORD:-skyforge-local-password}@postgres:5432/skyforge
      REDIS_URL: redis://redis:6379
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      ALLOW_INLINE_JOBS: "false"
      ALLOW_CUSTOM_HEALTH_HOSTS: "false"
      SERVE_CLIENT: "false"
      TRUST_PROXY: "false"
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - generated_data:/app/generated
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        INSTALL_DOCKER_CLI: "true"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://skyforge:${POSTGRES_PASSWORD:-skyforge-local-password}@postgres:5432/skyforge
      REDIS_URL: redis://redis:6379
      ALLOW_INLINE_JOBS: "false"
      ALLOW_CUSTOM_HEALTH_HOSTS: "false"
      DOCKER_HOST: unix:///var/run/docker.sock
    command: ["node", "workers/index.js"]
    volumes:
      - generated_data:/app/generated
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_ORIGIN: ""
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  generated_data:

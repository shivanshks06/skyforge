<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050508" />
    <meta
      name="description"
      content="SkyForge plans, builds, deploys, monitors, and rolls back applications on AWS."
    />
    <title>SkyForge — AWS deployment platform</title>
    <script>
      // Apply the saved (or system) theme before the first paint, so dark mode never flashes light.
      try {
        var saved = localStorage.getItem("skyforge.theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
